<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#3730a3" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <radialGradient id="lightGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#a5b4fc" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.75" />
    </radialGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="640" height="360" fill="url(#bgGrad)" />
  <rect width="640" height="360" fill="url(#lightGlow)" />

  <g stroke="rgba(255,255,255,0.06)" stroke-width="1.5">
    <line x1="0" y1="40" x2="640" y2="40" />
    <line x1="0" y1="120" x2="640" y2="120" />
    <line x1="0" y1="200" x2="640" y2="200" />
    <line x1="0" y1="280" x2="640" y2="280" />
    <line x1="160" y1="0" x2="160" y2="360" />
    <line x1="320" y1="0" x2="320" y2="360" />
    <line x1="480" y1="0" x2="480" y2="360" />
  </g>

  <g filter="url(#dropShadow)">
    
      <!-- City Hall Building &amp; Shield -->
      <path d="M240 130 L320 85 L400 130 Z" fill="#a5b4fc"/>
      <rect x="250" y="130" width="140" height="90" fill="none" stroke="#ffffff" stroke-width="8"/>
      <!-- Columns -->
      <line x1="280" y1="130" x2="280" y2="220" stroke="#ffffff" stroke-width="6"/>
      <line x1="320" y1="130" x2="320" y2="220" stroke="#ffffff" stroke-width="6"/>
      <line x1="360" y1="130" x2="360" y2="220" stroke="#ffffff" stroke-width="6"/>
      <!-- Steps -->
      <path d="M230 220 H410 V235 H230 Z" fill="#ffffff"/>
      <path d="M215 235 H425 V250 H215 Z" fill="#ffffff"/>
      <!-- Solidarity Heart Icon -->
      <circle cx="320" cy="175" r="22" fill="#4f46e5"/>
      <path d="M320 185 C310 175 305 168 310 162 C315 158 320 162 320 165 C320 162 325 158 330 162 C335 168 330 175 320 185 Z" fill="#ffffff"/>
    
  </g>

  <!-- Top Pill -->
  <g transform="translate(32, 28)">
    <rect width="180" height="28" rx="14" fill="rgba(15, 23, 42, 0.75)" stroke="rgba(255, 255, 255, 0.25)" stroke-width="1"/>
    <circle cx="16" cy="14" r="5" fill="#a5b4fc"/>
    <text x="30" y="18" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="800" letter-spacing="0.5">CFDT INTERCO</text>
  </g>

  <!-- Right Badge -->
  <g transform="translate(400, 28)">
    <rect width="208" height="28" rx="14" fill="rgba(255, 255, 255, 0.18)" stroke="rgba(255, 255, 255, 0.3)" stroke-width="1"/>
    <text x="104" y="18" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700">Territoriale • Mairies</text>
  </g>

  <!-- Bottom Bar -->
  <g transform="translate(24, 275)" filter="url(#dropShadow)">
    <rect width="592" height="64" rx="12" fill="rgba(15, 23, 42, 0.88)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1"/>
    <text x="20" y="28" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="900" letter-spacing="0.3">SOUTIEN AUX AGENTS TERRITORIAUX</text>
    <text x="20" y="48" fill="#a5b4fc" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600">Solidarité mairies et collectivités locales</text>
    <circle cx="560" cy="32" r="16" fill="#a5b4fc" />
    <path d="M556 26 L563 32 L556 38" fill="none" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>