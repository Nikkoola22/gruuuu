<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Overlay Radial Lighting -->
    <radialGradient id="lightGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.75" />
    </radialGradient>

    <!-- Card Shadow -->
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="640" height="360" fill="url(#bgGrad)" />
  <rect width="640" height="360" fill="url(#lightGlow)" />

  <!-- Geometric Pattern Lines (High-Tech Mesh) -->
  <g stroke="rgba(255,255,255,0.06)" stroke-width="1.5">
    <line x1="0" y1="40" x2="640" y2="40" />
    <line x1="0" y1="120" x2="640" y2="120" />
    <line x1="0" y1="200" x2="640" y2="200" />
    <line x1="0" y1="280" x2="640" y2="280" />
    <line x1="160" y1="0" x2="160" y2="360" />
    <line x1="320" y1="0" x2="320" y2="360" />
    <line x1="480" y1="0" x2="480" y2="360" />
    <!-- Diagonal Dynamic Accent -->
    <line x1="0" y1="0" x2="640" y2="360" stroke="rgba(255,255,255,0.04)" stroke-width="2"/>
    <line x1="640" y1="0" x2="0" y2="360" stroke="rgba(255,255,255,0.04)" stroke-width="2"/>
  </g>

  <!-- Central Thematic Icon with Glow -->
  <g filter="url(#dropShadow)">
    
      <!-- Supportive Hands & Shield -->
      <path d="M320 85 L390 120 V185 C390 230 320 265 320 265 C320 265 250 230 250 185 V120 Z" fill="rgba(56, 189, 248, 0.15)" stroke="#ffffff" stroke-width="10" stroke-linejoin="round"/>
      <!-- Figures: Educator helping youth -->
      <circle cx="300" cy="155" r="16" fill="#ffffff"/>
      <path d="M280 215 C280 185 320 185 320 215" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round"/>
      <circle cx="345" cy="170" r="12" fill="#38bdf8"/>
      <path d="M330 215 C330 195 360 195 360 215" fill="none" stroke="#38bdf8" stroke-width="7" stroke-linecap="round"/>
      <!-- Rising Arrow / Growth -->
      <path d="M210 230 L250 170 L280 200 L350 110" fill="none" stroke="rgba(56, 189, 248, 0.4)" stroke-width="6" stroke-linecap="round" stroke-dasharray="8 6"/>
    
  </g>

  <!-- Top Category Pill Badge -->
  <g transform="translate(32, 28)">
    <rect width="180" height="28" rx="14" fill="rgba(15, 23, 42, 0.75)" stroke="rgba(255, 255, 255, 0.25)" stroke-width="1"/>
    <circle cx="16" cy="14" r="5" fill="#38bdf8"/>
    <text x="30" y="18" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" letter-spacing="0.5">CFDT INTERCO</text>
  </g>

  <!-- Right Pill Badge -->
  <g transform="translate(420, 28)">
    <rect width="188" height="28" rx="14" fill="rgba(255, 255, 255, 0.18)" stroke="rgba(255, 255, 255, 0.3)" stroke-width="1"/>
    <text x="94" y="18" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">Jeunesse & Éducation</text>
  </g>

  <!-- Bottom Frosted Info Bar -->
  <g transform="translate(24, 275)" filter="url(#dropShadow)">
    <rect width="592" height="64" rx="12" fill="rgba(15, 23, 42, 0.88)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1"/>
    
    <!-- Title -->
    <text x="20" y="28" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="900" letter-spacing="0.3">PROTECTION JUDICIAIRE</text>
    
    <!-- Subtitle -->
    <text x="20" y="48" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">Renfort de 150 postes en milieu ouvert</text>
    
    <!-- Arrow Action -->
    <circle cx="560" cy="32" r="16" fill="#38bdf8" />
    <path d="M556 26 L563 32 L556 38" fill="none" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>