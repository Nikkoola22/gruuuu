<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#701a75" />
      <stop offset="50%" stop-color="#a21caf" />
      <stop offset="100%" stop-color="#db2777" />
    </linearGradient>

    <!-- Overlay Radial Lighting -->
    <radialGradient id="lightGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#f472b6" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.75" />
    </radialGradient>

    <!-- Card Shadow -->
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="640" height="360" fill="url(#bgGrad)" />
  <rect width="640" height="360" fill="url(#lightGlow)" />

  <!-- Geometric Pattern Lines (High-Tech Mesh) -->
  <g stroke="rgba(255,255,255,0.06)" stroke-width="1.5">
    <line x1="0" y1="40" x2="640" y2="40" />
    <line x1="0" y1="120" x2="640" y2="120" />
    <line x1="0" y1="200" x2="640" y2="200" />
    <line x1="0" y1="280" x2="640" y2="280" />
    <line x1="160" y1="0" x2="160" y2="360" />
    <line x1="320" y1="0" x2="320" y2="360" />
    <line x1="480" y1="0" x2="480" y2="360" />
    <!-- Diagonal Dynamic Accent -->
    <line x1="0" y1="0" x2="640" y2="360" stroke="rgba(255,255,255,0.04)" stroke-width="2"/>
    <line x1="640" y1="0" x2="0" y2="360" stroke="rgba(255,255,255,0.04)" stroke-width="2"/>
  </g>

  <!-- Central Thematic Icon with Glow -->
  <g filter="url(#dropShadow)">
    
      <!-- Venus Symbol + Equality -->
      <circle cx="320" cy="140" r="50" fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round"/>
      <line x1="320" y1="190" x2="320" y2="255" stroke="#ffffff" stroke-width="12" stroke-linecap="round"/>
      <line x1="285" y1="225" x2="355" y2="225" stroke="#ffffff" stroke-width="12" stroke-linecap="round"/>
      <!-- Equal Sign in center -->
      <line x1="305" y1="130" x2="335" y2="130" stroke="#f472b6" stroke-width="7" stroke-linecap="round"/>
      <line x1="305" y1="150" x2="335" y2="150" stroke="#f472b6" stroke-width="7" stroke-linecap="round"/>
      <!-- Sparks -->
      <circle cx="230" cy="110" r="6" fill="#fdf2f8" opacity="0.8"/>
      <circle cx="410" cy="120" r="8" fill="#fdf2f8" opacity="0.9"/>
      <circle cx="380" cy="200" r="5" fill="#fbcfe8" opacity="0.7"/>
    
  </g>

  <!-- Top Category Pill Badge -->
  <g transform="translate(32, 28)">
    <rect width="180" height="28" rx="14" fill="rgba(15, 23, 42, 0.75)" stroke="rgba(255, 255, 255, 0.25)" stroke-width="1"/>
    <circle cx="16" cy="14" r="5" fill="#f472b6"/>
    <text x="30" y="18" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" letter-spacing="0.5">CFDT INTERCO</text>
  </g>

  <!-- Right Pill Badge -->
  <g transform="translate(420, 28)">
    <rect width="188" height="28" rx="14" fill="rgba(255, 255, 255, 0.18)" stroke="rgba(255, 255, 255, 0.3)" stroke-width="1"/>
    <text x="94" y="18" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">Mobilisation Nationale</text>
  </g>

  <!-- Bottom Frosted Info Bar -->
  <g transform="translate(24, 275)" filter="url(#dropShadow)">
    <rect width="592" height="64" rx="12" fill="rgba(15, 23, 42, 0.88)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1"/>
    
    <!-- Title -->
    <text x="20" y="28" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="900" letter-spacing="0.3">DROITS DES FEMMES</text>
    
    <!-- Subtitle -->
    <text x="20" y="48" fill="#f472b6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">Égalité Réelle &amp; Salaires 8 Mars</text>
    
    <!-- Arrow Action -->
    <circle cx="560" cy="32" r="16" fill="#f472b6" />
    <path d="M556 26 L563 32 L556 38" fill="none" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>