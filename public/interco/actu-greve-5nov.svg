<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c2d12" />
      <stop offset="50%" stop-color="#c2410c" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <radialGradient id="lightGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#fed7aa" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.75" />
    </radialGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="640" height="360" fill="url(#bgGrad)" />
  <rect width="640" height="360" fill="url(#lightGlow)" />

  <g stroke="rgba(255,255,255,0.06)" stroke-width="1.5">
    <line x1="0" y1="40" x2="640" y2="40" />
    <line x1="0" y1="120" x2="640" y2="120" />
    <line x1="0" y1="200" x2="640" y2="200" />
    <line x1="0" y1="280" x2="640" y2="280" />
    <line x1="160" y1="0" x2="160" y2="360" />
    <line x1="320" y1="0" x2="320" y2="360" />
    <line x1="480" y1="0" x2="480" y2="360" />
  </g>

  <g filter="url(#dropShadow)">
    
      <!-- Megaphone / Mobilization -->
      <path d="M250 170 L340 125 V215 L250 170 Z" fill="#ffffff" stroke="#ffffff" stroke-width="6" stroke-linejoin="round"/>
      <rect x="220" y="150" width="30" height="40" rx="6" fill="#fed7aa"/>
      <path d="M235 190 V240 L260 230 V190" fill="#ffffff"/>
      <!-- Soundwaves -->
      <path d="M365 145 C385 160 385 180 365 195" fill="none" stroke="#fed7aa" stroke-width="7" stroke-linecap="round"/>
      <path d="M385 130 C415 155 415 190 385 210" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round"/>
      <!-- Strike Date Badge -->
      <rect x="260" y="85" width="120" height="30" rx="8" fill="#ffffff"/>
      <text x="320" y="105" text-anchor="middle" fill="#ea580c" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="900">5 NOVEMBRE</text>
    
  </g>

  <!-- Top Pill -->
  <g transform="translate(32, 28)">
    <rect width="180" height="28" rx="14" fill="rgba(15, 23, 42, 0.75)" stroke="rgba(255, 255, 255, 0.25)" stroke-width="1"/>
    <circle cx="16" cy="14" r="5" fill="#fed7aa"/>
    <text x="30" y="18" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="800" letter-spacing="0.5">CFDT INTERCO</text>
  </g>

  <!-- Right Badge -->
  <g transform="translate(400, 28)">
    <rect width="208" height="28" rx="14" fill="rgba(255, 255, 255, 0.18)" stroke="rgba(255, 255, 255, 0.3)" stroke-width="1"/>
    <text x="104" y="18" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700">Appel Unitaire FPT • FPE</text>
  </g>

  <!-- Bottom Bar -->
  <g transform="translate(24, 275)" filter="url(#dropShadow)">
    <rect width="592" height="64" rx="12" fill="rgba(15, 23, 42, 0.88)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1"/>
    <text x="20" y="28" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="900" letter-spacing="0.3">MOBILISATION 5 NOVEMBRE 2026</text>
    <text x="20" y="48" fill="#fed7aa" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600">Préavis UFFA-CFDT : Salaires &amp; Moyens publics</text>
    <circle cx="560" cy="32" r="16" fill="#fed7aa" />
    <path d="M556 26 L563 32 L556 38" fill="none" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>